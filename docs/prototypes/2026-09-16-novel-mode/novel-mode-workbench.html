<!doctype html>
<html lang="zh-CN" data-theme="day">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>小说模式 · 写作工作台（原型 v4）</title>
<style>
/* ═══ tokens · 日间 / 夜间 ═══ */
:root {
  /* 底色四档：窗口底 → 主面板 → 卡片/阅读区 → 输入区/次级面板 */
  --bg-000: 0 0% 100%;
  --bg-100: 48 33.3% 97.1%;
  --bg-200: 53 28.6% 94.5%;
  --bg-300: 48 25% 92.2%;
  --border-100: 51 16.5% 84.5%;
  --border-200: 48 14% 74%;
  --text-000: 60 2.6% 7.6%;
  --text-100: 60 2.6% 7.6%;
  --text-200: 60 2.6% 7.6%;
  --accent-brand: 15 63.1% 59.6%;
  --accent-brand-deep: 15 54.2% 51.2%;
  --accent-text: 15 55% 38%;
  --on-accent: 20 14% 10%;
  --ok: 150 22% 32%;
  --err: 2 45% 38%;
  --info: 212 20% 42%;
  --warn: 36 62% 32%;
  --f-none: 45 6% 46%;
  --f-port: 212 20% 46%;
  --f-river: 345 20% 40%;
  --f-press: 158 18% 36%;
  --f-bureau: 32 42% 45%;
  --font-ui: "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-serif: "Source Han Serif SC", "Noto Serif SC", "Songti SC", "SimSun", serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --fs-12: 12px;
  --fs-13: 13px;
  --fs-14: 14px;
  --fs-16: 16px;
  --fs-20: 20px;
  --read-size: 17px;
  --read-lh: 1.85;
  --read-measure: 40em;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px; --s7: 32px;
  --r-card: 10px; --r-ctl: 6px; --r-key: 4px;
  --sh-1: 0 1px 2px hsl(30 10% 10% / .04), 0 0 0 .5px hsl(var(--border-100));
  --sh-2: 0 2px 8px hsl(30 10% 10% / .07), 0 0 0 .5px hsl(var(--border-100));
  --sh-3: 0 14px 38px hsl(30 10% 10% / .18), 0 0 0 .5px hsl(var(--border-100));
  --t-fast: 150ms; --t-base: 220ms;
  --app-w: 1440px;
}
html[data-theme="night"] {
  --bg-000: 60 2.1% 18.4%;
  --bg-100: 60 2.7% 14.5%;
  --bg-200: 30 3.3% 11.8%;
  --bg-300: 60 2.6% 7.6%;
  /* 实测线值在夜间低于可辨识阈值，按两档提升以保证 1px 细线可见（见 design-tokens.md） */
  --border-100: 30 4% 22%;
  --border-200: 30 5% 30%;
  --text-000: 48 33.3% 97.1%;
  --text-100: 48 33.3% 97.1%;
  --text-200: 48 33.3% 97.1%;
  --accent-brand: 15 63.1% 59.6%;
  --accent-brand-deep: 15 60% 53%;
  --accent-text: 15 63.1% 59.6%;
  --on-accent: 20 14% 10%;
  --ok: 150 18% 60%;
  --err: 5 45% 62%;
  --info: 212 16% 68%;
  --warn: 36 48% 62%;
  --f-none: 45 6% 62%;
  --f-port: 212 18% 64%;
  --f-river: 345 22% 66%;
  --f-press: 158 16% 60%;
  --f-bureau: 32 40% 62%;
  --sh-1: 0 1px 2px hsl(0 0% 0% / .3), 0 0 0 .5px hsl(var(--border-100));
  --sh-2: 0 2px 8px hsl(0 0% 0% / .35), 0 0 0 .5px hsl(var(--border-100));
  --sh-3: 0 14px 38px hsl(0 0% 0% / .5), 0 0 0 .5px hsl(var(--border-100));
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: hsl(var(--bg-300));
  color: hsl(var(--text-100) / .92);
  font-family: var(--font-ui);
  font-size: var(--fs-13);
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; }
input, textarea, select { font: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; font-family: var(--font-serif); font-weight: 600; letter-spacing: .01em; }
p { margin: 0; }
svg { display: block; }
:focus-visible { outline: 2px solid hsl(var(--accent-brand)); outline-offset: 2px; border-radius: var(--r-key); }
[hidden] { display: none !important; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.mono { font-family: var(--font-mono); }
.muted { color: hsl(var(--text-200) / .7); }
.full { width: 100%; }
@media (prefers-reduced-motion: reduce) { * { transition-duration: 1ms !important; animation-duration: 1ms !important; } }

/* ═══ 原型切换条（不属于产品界面） ═══ */
body { display: flex; flex-direction: column; align-items: center; min-width: var(--app-w); }
.proto {
  width: var(--app-w);
  display: flex; flex-wrap: wrap; gap: var(--s2);
  align-items: center;
  padding: 8px var(--s5);
  background: hsl(var(--bg-300));
  border-bottom: 1px solid hsl(var(--border-100));
}
.proto .proto-label { font-size: var(--fs-12); color: hsl(var(--text-200) / .7); padding-right: var(--s2); }
.proto .spacer { flex: 1; }
.pchip {
  display: inline-flex; align-items: center; gap: 6px;
  height: 26px; padding: 0 10px;
  border-radius: var(--r-key);
  border: 1px solid hsl(var(--border-100));
  background: hsl(var(--bg-100));
  font-size: var(--fs-12); color: hsl(var(--text-100) / .85);
  transition: background var(--t-fast), border-color var(--t-fast), color var(--t-fast);
}
.pchip:hover { background: hsl(var(--bg-000)); border-color: hsl(var(--border-200)); }
.pchip[aria-pressed="true"] { background: hsl(var(--accent-brand) / .14); border-color: hsl(var(--accent-brand) / .55); color: hsl(var(--accent-text)); font-weight: 600; }
.pchip .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .55; }

/* ═══ 舞台与应用骨架 ═══ */
.stage { width: var(--app-w); height: 900px; }
.app {
  position: relative;
  width: 100%; height: 100%;
  display: grid;
  grid-template-columns: 248px minmax(0, 1fr) 296px;
  grid-template-rows: 44px minmax(0, 1fr) 88px;
  grid-template-areas: "top top top" "rail main side" "composer composer composer";
  background: hsl(var(--bg-000));
  border: 1px solid hsl(var(--border-100));
  border-radius: var(--r-card);
  overflow: clip;
  box-shadow: var(--sh-2);
}

/* 顶栏 */
.topbar {
  grid-area: top;
  display: flex; align-items: center; gap: var(--s3);
  padding: 0 var(--s4);
  background: hsl(var(--bg-100));
  border-bottom: 1px solid hsl(var(--border-100));
}
.topbar .brand { font-family: var(--font-serif); font-size: var(--fs-14); font-weight: 600; color: hsl(var(--text-000)); }
.topbar .sep { width: 1px; height: 18px; background: hsl(var(--border-100)); }
.topbar .ctx { font-size: var(--fs-13); color: hsl(var(--text-200) / .75); }
.topbar .right { margin-left: auto; display: flex; align-items: center; gap: var(--s2); }
.vbadge {
  font-family: var(--font-mono); font-size: var(--fs-12); font-weight: 600;
  padding: 2px 7px; border-radius: var(--r-key);
  background: hsl(var(--accent-brand) / .14); color: hsl(var(--accent-text));
  border: 1px solid hsl(var(--accent-brand) / .35);
}

/* 左栏 */
.rail {
  grid-area: rail;
  display: flex; flex-direction: column;
  background: hsl(var(--bg-100));
  border-right: 1px solid hsl(var(--border-100));
  min-height: 0;
}
.rail-scroll { flex: 1; overflow-y: auto; padding: var(--s3) var(--s2) var(--s2); }
.rail-foot { border-top: 1px solid hsl(var(--border-100)); padding: var(--s2); }
.grp + .grp { margin-top: var(--s5); }
.grp-head {
  display: flex; align-items: center; gap: 6px;
  padding: 0 6px var(--s2);
  font-size: var(--fs-12); color: hsl(var(--text-200) / .68);
}
.grp-head .count { margin-left: auto; font-family: var(--font-mono); }
.item {
  display: flex; align-items: center; gap: var(--s2);
  width: 100%; padding: 5px 8px;
  border-radius: var(--r-ctl);
  font-size: var(--fs-13); color: hsl(var(--text-100) / .88);
  text-align: left;
  transition: background var(--t-fast), color var(--t-fast);
}
.item:hover { background: hsl(var(--bg-000) / .8); }
.item[aria-current="true"], .item.on { background: hsl(var(--accent-brand) / .13); color: hsl(var(--accent-text)); font-weight: 600; }
.item .ico { flex: none; width: 15px; height: 15px; opacity: .8; }
.item .tail { margin-left: auto; font-family: var(--font-mono); font-size: var(--fs-12); color: hsl(var(--text-200) / .7); }
.item[aria-current="true"] .tail { color: hsl(var(--accent-text)); }
.vol-head {
  display: flex; align-items: center; gap: 6px;
  padding: var(--s3) 8px var(--s1);
  font-size: var(--fs-12); color: hsl(var(--text-200) / .7);
}
.vol-head .vol-meta { margin-left: auto; font-family: var(--font-mono); }
.ch-item { padding-left: 8px; gap: 7px; }
.ch-item .ord { flex: none; width: 18px; font-family: var(--font-mono); font-size: var(--fs-12); color: hsl(var(--text-200) / .7); text-align: right; }
.ch-item .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.st-dot { flex: none; width: 7px; height: 7px; border-radius: 50%; }
.st-dot.ok { background: hsl(var(--ok)); }
.st-dot.pend { background: hsl(var(--accent-brand)); }
.st-dot.plan { background: hsl(var(--border-200)); }
.st-dot.warn { background: hsl(var(--warn)); }

/* 右栏 */
.side {
  grid-area: side;
  display: flex; flex-direction: column;
  background: hsl(var(--bg-100));
  border-left: 1px solid hsl(var(--border-100));
  min-height: 0;
}
.side-scroll { flex: 1; overflow-y: auto; padding: var(--s3) var(--s3) var(--s4); }
.side-block + .side-block { margin-top: var(--s4); padding-top: var(--s4); border-top: 1px solid hsl(var(--border-100)); }
.side-title { display: flex; align-items: center; gap: 6px; font-size: var(--fs-12); color: hsl(var(--text-200) / .7); margin-bottom: var(--s2); }
.side-title .more { margin-left: auto; font-size: var(--fs-12); color: hsl(var(--accent-text)); }

/* 主画布 */
.main { grid-area: main; min-height: 0; display: flex; flex-direction: column; background: hsl(var(--bg-000)); }
.main-head {
  display: flex; align-items: flex-end; gap: var(--s3);
  padding: var(--s4) var(--s6) var(--s3);
  border-bottom: 1px solid hsl(var(--border-100));
}
.main-head .h-wrap { min-width: 0; }
.main-head h1 { font-size: var(--fs-20); color: hsl(var(--text-000)); }
.main-head .sub { margin-top: 3px; font-size: var(--fs-13); color: hsl(var(--text-200) / .72); }
.main-head .tools { margin-left: auto; display: flex; align-items: center; gap: var(--s2); flex: none; }
.main-body { flex: 1; overflow-y: auto; padding: var(--s5) var(--s6) var(--s6); min-height: 0; }
.main-body.flush { padding: 0; }

/* 底部输入条 */
.composer {
  grid-area: composer;
  display: grid; grid-template-columns: 176px minmax(0, 1fr) auto;
  gap: var(--s3); align-items: center;
  padding: var(--s3) var(--s4);
  background: hsl(var(--bg-300));
  border-top: 1px solid hsl(var(--border-100));
}
.composer .inline { display: flex; align-items: center; gap: var(--s2); }
#cmpThreadLabel { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ═══ 通用控件（静置 / hover / active / disabled / loading 五态） ═══ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  height: 32px; padding: 0 14px;
  border-radius: var(--r-ctl);
  border: 1px solid hsl(var(--border-100));
  background: hsl(var(--bg-000));
  color: hsl(var(--text-100) / .92);
  font-size: var(--fs-13); font-weight: 500;
  transition: background var(--t-fast), border-color var(--t-fast), color var(--t-fast), transform 60ms;
  white-space: nowrap;
}
.btn:hover { background: hsl(var(--bg-100)); border-color: hsl(var(--border-200)); }
.btn:active { transform: translateY(1px); background: hsl(var(--bg-200)); }
.btn.primary {
  background: hsl(var(--accent-brand)); border-color: hsl(var(--accent-brand)); color: hsl(var(--on-accent)); font-weight: 600;
}
.btn.primary:hover { background: hsl(var(--accent-brand) / .88); border-color: hsl(var(--accent-brand-deep)); }
.btn.primary:active { background: hsl(var(--accent-brand)); border-color: hsl(var(--accent-brand-deep)); color: hsl(var(--on-accent)); transform: translateY(1px); }
.btn.ghost { background: transparent; border-color: transparent; color: hsl(var(--text-200) / .8); }
.btn.ghost:hover { background: hsl(var(--bg-100)); color: hsl(var(--text-000)); }
.btn.danger { color: hsl(var(--err)); border-color: hsl(var(--err) / .4); background: hsl(var(--bg-000)); }
.btn.danger:hover { background: hsl(var(--err) / .1); border-color: hsl(var(--err) / .6); }
.btn[disabled], .btn.is-disabled {
  opacity: .45; cursor: not-allowed; background: hsl(var(--bg-200)); color: hsl(var(--text-200) / .8); border-color: hsl(var(--border-100));
}
.btn[disabled]:hover, .btn.is-disabled:hover { background: hsl(var(--bg-200)); border-color: hsl(var(--border-100)); transform: none; }
.btn.loading { cursor: progress; color: hsl(var(--text-200) / .85); }
.btn.primary.loading { background: hsl(var(--accent-brand) / .55); color: hsl(var(--on-accent)); }
.btn.sm { height: 26px; padding: 0 10px; font-size: var(--fs-12); }
.btn.lg { height: 36px; padding: 0 18px; font-size: var(--fs-14); }
.spinner {
  width: 12px; height: 12px; border-radius: 50%;
  border: 1.5px solid currentColor; border-right-color: transparent;
  animation: spin 700ms linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.seg { display: inline-flex; padding: 1px; border-radius: var(--r-ctl); background: hsl(var(--bg-300)); border: 1px solid hsl(var(--border-100)); }
.seg button {
  height: 24px; padding: 0 10px; border-radius: 5px; font-size: var(--fs-12); color: hsl(var(--text-200) / .8);
  transition: background var(--t-fast), color var(--t-fast);
}
.seg button:hover { color: hsl(var(--text-000)); background: hsl(var(--bg-100)); }
.seg button[aria-pressed="true"] { background: hsl(var(--bg-000)); color: hsl(var(--text-000)); font-weight: 600; box-shadow: var(--sh-1); }
.seg button:disabled { opacity: .45; cursor: not-allowed; }

.chip {
  display: inline-flex; align-items: center; gap: 5px;
  height: 22px; padding: 0 8px; border-radius: var(--r-key);
  border: 1px solid hsl(var(--border-100));
  background: hsl(var(--bg-100));
  font-size: var(--fs-12); color: hsl(var(--text-200) / .82);
  white-space: nowrap;
}
.chip.ok { color: hsl(var(--ok)); border-color: hsl(var(--ok) / .35); background: hsl(var(--ok) / .08); }
.chip.warn { color: hsl(var(--warn)); border-color: hsl(var(--warn) / .4); background: hsl(var(--warn) / .1); }
.chip.err { color: hsl(var(--err)); border-color: hsl(var(--err) / .4); background: hsl(var(--err) / .08); }
.chip.info { color: hsl(var(--info)); border-color: hsl(var(--info) / .35); background: hsl(var(--info) / .08); }
.chip.accent { color: hsl(var(--accent-text)); border-color: hsl(var(--accent-brand) / .45); background: hsl(var(--accent-brand) / .12); }
.chip .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.tag { display: inline-flex; align-items: center; height: 22px; padding: 0 9px; border-radius: 999px; font-size: var(--fs-12); color: hsl(var(--text-200) / .8); border: 1px solid hsl(var(--border-100)); }

.field { display: flex; flex-direction: column; gap: 5px; }
.field label, .field .lbl { font-size: var(--fs-12); color: hsl(var(--text-200) / .75); }
.inp, .ta, .sel {
  width: 100%; height: 32px; padding: 0 10px;
  border: 1px solid hsl(var(--border-100)); border-radius: var(--r-ctl);
  background: hsl(var(--bg-000)); color: hsl(var(--text-100) / .92);
  font-size: var(--fs-13);
  transition: border-color var(--t-fast), background var(--t-fast);
}
.ta { height: auto; min-height: 62px; padding: 8px 10px; resize: vertical; line-height: 1.6; }
.inp:hover, .ta:hover, .sel:hover { border-color: hsl(var(--border-200)); }
.inp:focus, .ta:focus, .sel:focus { outline: none; border-color: hsl(var(--accent-brand)); box-shadow: 0 0 0 3px hsl(var(--accent-brand) / .16); }
.inp[disabled], .ta[disabled], .sel[disabled] { opacity: .5; cursor: not-allowed; }
.inp::placeholder, .ta::placeholder { color: hsl(var(--text-200) / .5); }

.switch { display: inline-flex; align-items: center; gap: 7px; font-size: var(--fs-12); color: hsl(var(--text-200) / .8); }
.switch .track { width: 30px; height: 17px; border-radius: 999px; background: hsl(var(--border-200)); position: relative; transition: background var(--t-fast); flex: none; }
.switch .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 13px; height: 13px; border-radius: 50%; background: hsl(var(--bg-000)); transition: transform var(--t-fast); box-shadow: var(--sh-1); }
.switch[aria-checked="true"] .track { background: hsl(var(--accent-brand)); }
.switch[aria-checked="true"] .track::after { transform: translateX(13px); }
.switch:hover .track { box-shadow: 0 0 0 3px hsl(var(--accent-brand) / .14); }

.card { background: hsl(var(--bg-200)); border: 1px solid hsl(var(--border-100)); border-radius: var(--r-card); padding: var(--s4); box-shadow: var(--sh-1); }
.card.plain { background: hsl(var(--bg-000)); }
.card.flat { background: transparent; box-shadow: none; }
.card-h { display: flex; align-items: center; gap: var(--s2); margin-bottom: var(--s3); }
.card-h .t { font-size: var(--fs-14); font-weight: 600; color: hsl(var(--text-000)); }
.card-h .r { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.kv { display: grid; grid-template-columns: 64px 1fr; gap: 4px var(--s3); font-size: var(--fs-13); }
.kv dt { color: hsl(var(--text-200) / .7); }
.kv dd { margin: 0; color: hsl(var(--text-100) / .9); }
.rule { height: 1px; background: hsl(var(--border-100)); border: 0; margin: var(--s4) 0; }
.note { font-size: var(--fs-12); color: hsl(var(--text-200) / .7); }
.lead { font-size: var(--fs-14); color: hsl(var(--text-200) / .85); }
.grid { display: grid; gap: var(--s4); }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.row { display: flex; align-items: center; gap: var(--s2); }
.row.between { justify-content: space-between; }
.col { display: flex; flex-direction: column; gap: var(--s2); }
.stack > * + * { margin-top: var(--s3); }
.progress { height: 4px; border-radius: 999px; background: hsl(var(--bg-300)); overflow: hidden; }
.progress > i { display: block; height: 100%; background: hsl(var(--accent-brand)); }
.progress.ok > i { background: hsl(var(--ok)); }

/* 骨架屏 */
.sk { border-radius: var(--r-key); background: linear-gradient(90deg, hsl(var(--bg-300)), hsl(var(--bg-200)), hsl(var(--bg-300))); background-size: 240px 100%; animation: shimmer 1.5s linear infinite; }
@keyframes shimmer { from { background-position: -120px 0; } to { background-position: 120px 0; } }
.sk-line { height: 10px; margin-bottom: 8px; }
.sk-card { height: 72px; border-radius: var(--r-card); margin-bottom: 10px; }

/* ═══ 故事地图 ═══ */
.map-wrap { position: relative; height: 100%; min-height: 0; display: flex; flex-direction: column; }
.map-bar {
  display: flex; align-items: center; gap: var(--s2);
  padding: var(--s3) var(--s6);
  border-bottom: 1px solid hsl(var(--border-100));
  background: hsl(var(--bg-000));
  flex-wrap: wrap;
}
.map-bar .grow { flex: 1; }
.search { position: relative; }
.search .inp { width: 188px; padding-left: 26px; }
.search svg { position: absolute; left: 8px; top: 9px; opacity: .55; }
.pop {
  position: absolute; z-index: 30; top: calc(100% + 4px); left: 0; width: 240px;
  background: hsl(var(--bg-000)); border: 1px solid hsl(var(--border-100)); border-radius: var(--r-ctl);
  box-shadow: var(--sh-3); padding: 4px; max-height: 240px; overflow-y: auto;
}
.pop button { display: flex; align-items: center; gap: 6px; width: 100%; padding: 6px 8px; border-radius: var(--r-key); font-size: var(--fs-13); text-align: left; }
.pop button:hover { background: hsl(var(--bg-100)); }

  <div class="app" id="app" data-narrow="0">
    <header class="topbar" data-od-id="topbar">

var MB={w:880,h:740,cx:440,cy:356};
function layout(){
  var d=derive(), key=D.clusterBy==='faction'?'faction':'place';
  var ids = key==='faction' ? FACTIONS.map(function(f){ return f.id; }) : PLACES.map(function(p){ return p.id; });
  var groups=ids.map(function(gid){
    var list=CHARS.filter(function(c){ return c[key]===gid; });
    return { id:gid, mains:list.filter(function(c){ return c.main; }), rest:list.filter(function(c){ return !c.main; }) };
  }).filter(function(g){ return g.mains.length||g.rest.length; });
  var n=groups.length, R = n>=5?238:(n===4?218:206), pos={}, clusters=[];
  var label = function(id){
    if(key==='faction'){ var f=FACTIONS.filter(function(x){ return x.id===id; })[0]; return f?f.name:id; }
    var p=PLACES.filter(function(x){ return x.id===id; })[0]; return p?p.name:id;
  };
  groups.forEach(function(g,i){
    var a=(-90+i*(360/n))*Math.PI/180;
    var cxp=MB.cx+Math.cos(a)*R, cyp=MB.cy+Math.sin(a)*R;
    var expanded=!!D.expanded[g.id];
    var members = g.mains.concat(expanded?g.rest:[]);
    var ring = 34+Math.min(members.length,5)*11 + (expanded?22:0);
    members.forEach(function(c,j){
      var aa=(members.length===1? -Math.PI/2 : -Math.PI/2 + j*(2*Math.PI/members.length));
      pos[c.id]= D.pins[c.id] ? {x:D.pins[c.id].x, y:D.pins[c.id].y, pinned:true} : { x:cxp+Math.cos(aa)*ring, y:cyp+Math.sin(aa)*ring };
    });
    var box = ring+52;
    clusters.push({ id:g.id, label:label(g.id), cx:cxp, cy:cyp, r:box, out:a,
      bubble:(!expanded&&g.rest.length)?{ x:cxp+Math.cos(a)*(ring+46), y:cyp+Math.sin(a)*(ring+46), n:g.rest.length, ids:g.rest.map(function(c){ return c.id; }) }:null });
  });
  return { pos:pos, clusters:clusters };
}

function searchResults(){

      '<span class="muted" style="margin-left:auto;font-size:12px">'+esc(c.role.slice(0,8))+'</span></button>';

function mapSVG(){
  var d=derive(), L=layout();
  var vis=CHARS.filter(function(c){
    if(D.vol2only) return vols(c).indexOf(2)>=0;
    return c.main || Object.keys(D.expanded).some(function(k){ return D.expanded[k]===c.id; });
  });
  var restOf=function(gid){
    var key=D.clusterBy==='faction'?'faction':'place';
    return CHARS.filter(function(c){ return !c.main && c[key]===gid; });
  };
  var s='<svg viewBox="0 0 '+MB.w+' '+MB.h+'" preserveAspectRatio="xMidYMid meet" role="img" aria-label="人物关系故事地图">';
  s+='<defs>'+
    '<marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0l8 4-8 4z" fill="hsl(var(--border-200))"/></marker>'+
    '<marker id="arhot" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0l8 4-8 4z" fill="hsl(var(--accent-brand))"/></marker>'+
    '</defs>';
  s+='<g transform="translate('+D.pan.x+','+D.pan.y+') scale('+D.zoom+')">';
  /* 簇底与标签 */
  L.clusters.forEach(function(cl){
    s+='<circle class="cluster" cx="'+cl.cx+'" cy="'+cl.cy+'" r="'+cl.r+'"/>';
    s+='<text class="cluster-label" x="'+cl.cx+'" y="'+(cl.cy-cl.r-6)+'" text-anchor="middle">'+esc(cl.label)+'</text>';
  });
  /* 边（双向：两半各自独立） */
  d.rels.forEach(function(r){
    var A=L.pos[r.a], B=L.pos[r.b];
    if(!A||!B) return;
    var hot = D.sel && (r.a===D.sel||r.b===D.sel);
    var dim = D.sel && !hot;
    var dx=B.x-A.x, dy=B.y-A.y, len=Math.sqrt(dx*dx+dy*dy)||1, ux=dx/len, uy=dy/len, px=-uy*5, py=ux*5;
    var cls='e-line'+(hot?' hot':'')+(dim?' dim':'');
    var m=hot?'url(#arhot)':'url(#ar)';
    s+='<line class="'+cls+'" x1="'+(A.x+px)+'" y1="'+(A.y+py)+'" x2="'+(B.x+px-ux*10)+'" y2="'+(B.y+py-uy*10)+'" marker-end="'+m+'"/>';
    s+='<line class="'+cls+' back" x1="'+(B.x-px)+'" y1="'+(B.y-py)+'" x2="'+(A.x-px+ux*10)+'" y2="'+(A.y-py+uy*10)+'" marker-end="'+m+'"/>';
    var mx=(A.x+B.x)/2, my=(A.y+B.y)/2;
    s+='<line class="e-hit" x1="'+(A.x+px)+'" y1="'+(A.y+py)+'" x2="'+(B.x+px)+'" y2="'+(B.y+py)+'" data-act="edge-tip" data-rel="'+r.id+'"/>';
    s+='<line class="e-hit" x1="'+(B.x-px)+'" y1="'+(B.y-py)+'" x2="'+(A.x-px)+'" y2="'+(A.y-py)+'" data-act="edge-tip" data-rel="'+r.id+'"/>';
  });
  /* 折叠气泡 */
  L.clusters.forEach(function(cl){
    if(!cl.bubble) return;
    if(!restOf(cl.id).length) return;
    s+='<g data-act="expand" data-cluster="'+cl.id+'"><circle class="bubble" cx="'+cl.bubble.x+'" cy="'+cl.bubble.y+'" r="15"/>'+
       '<text class="bubble-text" x="'+cl.bubble.x+'" y="'+(cl.bubble.y+3.5)+'" text-anchor="middle">+'+cl.bubble.n+'</text></g>';
  });
  /* 节点 */
  CHARS.forEach(function(c){
    var p=L.pos[c.id]; if(!p) return;
    var shown = vis.indexOf(c)>=0;
    var dim = D.sel && D.sel!==c.id && !d.rels.some(function(r){ return (r.a===D.sel&&r.b===c.id)||(r.b===D.sel&&r.a===c.id); });
    var r=nodeR(c), f=FACTIONS.filter(function(x){ return x.id===c.faction; })[0];
    var hidden = D.vol2only && !shown;
    var g='<g class="n-g'+(dim?' dim':'')+(hidden?' hidden':'')+'" tabindex="0" role="button" data-act="node" data-id="'+c.id+'" data-od-id="map-node-'+c.id+'" aria-label="'+esc(c.name+'，'+c.role)+'">';
    if(D.sel===c.id) g+='<circle class="n-halo" cx="'+p.x+'" cy="'+p.y+'" r="'+(r+9)+'"/>';
    g+='<circle class="n-body'+(D.sel===c.id?' sel':'')+'" cx="'+p.x+'" cy="'+p.y+'" r="'+r+'" fill="'+tok(f.tok)+'" fill-opacity="'+(c.unknown?'.42':'.9')+'"/>';
    if(c.unknown) g+='<circle cx="'+p.x+'" cy="'+p.y+'" r="'+(r-3)+'" fill="none" stroke="hsl(var(--bg-000))" stroke-width="1" stroke-dasharray="2 2"/>';
    g+='<circle class="n-emo" cx="'+(p.x+r*0.72)+'" cy="'+(p.y-r*0.78)+'" r="3.6" fill="'+tok(toneTok(c.tone))+'"/>';
    if(c.debt) g+='<g class="n-debt"><circle cx="'+(p.x-r*0.72)+'" cy="'+(p.y+r*0.78)+'" r="6" fill="'+tok('--warn')+'"/>'+
      '<text x="'+(p.x-r*0.72)+'" y="'+(p.y+r*0.78+3)+'" text-anchor="middle">'+c.debt+'</text></g>';
    if(p.pinned) g+='<g class="n-pin"><circle cx="'+p.x+'" cy="'+(p.y-r-9)+'" r="3" fill="'+tok('--accent-brand')+'"/></g>';
    g+='<text class="n-label'+(D.sel===c.id?' sel':'')+'" x="'+p.x+'" y="'+(p.y+r+13)+'" text-anchor="middle">'+esc(c.name)+'</text></g>';
    s+=g;
  });
  s+='</g></svg>';
  return s;
}

    var n=revN(r.ver), isCur=n===d.rev, inactive=n>d.rev;

    if(n===6){
      if(d.propState==='accepted'){ sum='R6：接受第 6 章正文与 6 条设定变更'; time='刚刚'; }

function renderCanvas(){
  if(D.pluginErr){ D.screen='contract'; }
  if(D.screen==='proposal'&&D.propState==='discarded') D.screen='map';
  if(D.empty){ renderEmptyScreen(); return; }
  var s = D.adv ? 'advanced' : D.screen;
  if(D.loading && s!=='map'){ $('#mainBody').className='main-body'; $('#mainBody').innerHTML=skeletonBlock(); return; }
  if(s==='map') renderMapScreen();
  else if(s==='characters') renderCharactersScreen();
  else if(s==='foreshadow') renderForeshadowScreen();
  else if(s==='debts') renderDebtsScreen();
  else if(s==='timeline') renderTimelineScreen();
  else if(s==='memory') renderMemoryScreen();
  else if(s==='contract') renderContractScreen();
  else if(s==='sim') renderSimScreen();
  else if(s==='history') renderHistoryScreen();
  else if(s==='read') renderReadScreen();
  else if(s==='proposal') renderProposalScreen();
  else if(s==='thread') renderThreadScreen();
  else if(s==='advanced') renderAdvancedScreen();
  else renderMapScreen();
}

/* ══════════════ 交互 ══════════════ */
function resolveTheme(){
  if(D.themePref==='auto'){
    D.theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'day';
  } else D.theme = D.themePref;
}
function resetDecisions(){
  PROPOSAL.changes.forEach(function(c){ D.decisions[c.id]='accept'; D.reasons[c.id]=''; });
}
function goto(k){
  D.settings=false;
  if(k==='night'){ D.themePref='night'; D.theme='night'; D.adv=false; D.screen='map'; }
  else if(k==='boundary'){ D.empty=true; D.loading=false; D.pluginErr=false; D.adv=false; D.screen='map'; }
  else if(k==='expired'){ D.empty=false; D.loading=false; D.aiFail=false; D.revision=6; D.propState='expired'; D.adv=false; D.screen='proposal'; }
  else if(k==='split'){ D.empty=false; D.loading=false; D.revision=6; D.propState='split'; resetDecisions();
    D.decisions.c2='reject'; D.reasons.c2='通道先作为 3 号冷库的内部结构，不单独立成地点。'; D.adv=false; D.screen='proposal'; }
  else if(k==='proposal'){ D.empty=false; D.loading=false; D.aiFail=false; D.revision=5; D.propState='pending'; resetDecisions(); D.adv=false; D.screen='proposal'; }
  else if(k==='read'){ D.empty=false; D.adv=false; D.screen='read'; D.readCh=4; D.hl={ ch:4, text:'左臂在门框上狠狠磕了一下', label:'第 4 章 · 陈默受伤' }; }
  else if(k==='characters'){ D.empty=false; D.adv=false; D.screen='map'; D.drawer='chen-mo'; }
  else if(k==='advanced'){ D.empty=false; D.adv=true; D.screen='advanced'; }
  else if(k==='thread'){ D.empty=false; D.adv=false; D.screen='thread'; }
  else { D.empty=false; D.loading=false; D.adv=false; D.screen=k; }
  render();
}
function applyAccept(split){
  var d=derive();
  D.propState = split ? 'split' : 'accepted';
  D.revision = 6; D.modal=null; D.screen='proposal';
  render();
  toast(split ? '已写入 R6：' + d.acceptCount + ' 条设定变更，正文未接受' : '已接受为 R6');
}
function setDraft(text){
  var i=$('#cmpInput'); i.value=text; i.focus(); i.setSelectionRange(text.length,text.length);
}
document.addEventListener('click', function(e){
  var el=e.target.closest('[data-act]');
  if(!el) return;
  var act=el.dataset.act;
  if(el.tagName==='INPUT'||el.tagName==='TEXTAREA') return;
  switch(act){
    case 'go': goto(el.dataset.go); break;
    case 'node': D.sel=el.dataset.id; render(); break;
    case 'toggle': {
      var k=el.dataset.toggle;
      if(k==='adv'){ D.adv=!D.adv; D.screen=D.adv?'advanced':(D.screen==='advanced'?'map':D.screen); if(D.adv&&D.advTab) D.screen='advanced'; }
      else if(k==='settings'){ D.settings=!D.settings; }
      else if(k==='empty'){ D.empty=!D.empty; D.screen='map'; D.drawer=null; }
      else if(k==='narrow'){ D.narrow=!D.narrow; }
      else if(k==='loading'){ D.loading=!D.loading; }
      else if(k==='pluginErr'){ D.pluginErr=!D.pluginErr; D.screen=D.pluginErr?'contract':(D.screen==='contract'?'map':D.screen); }
      else if(k==='aiFail'){ D.aiFail=!D.aiFail; }
      else if(k==='showTools'){ D.showTools=!(D.showTools!==false); }
      render(); break;
    }
    case 'toggle-side': D.sideOpen=!D.sideOpen; $('#side').classList.toggle('open',!!D.sideOpen); break;
    case 'theme': D.themePref=el.dataset.theme; resolveTheme(); render(); break;
    case 'theme-quick': D.themePref=D.theme==='night'?'day':'night'; resolveTheme(); render(); break;
    case 'read-size': D.readSize=+el.dataset.size; render(); break;
    case 'read-width': D.readW=+el.dataset.w; render(); break;
    case 'view': goto(el.dataset.view); break;
    case 'chapter': {
      var n=+el.dataset.ch, dd=derive();
      if(n===6 && dd.propState==='pending'){ D.screen='proposal'; }
      else { D.screen='read'; D.readCh=n; D.hl=null; }
      render(); break;
    }
    case 'read': D.screen='read'; D.readCh=+el.dataset.ch; D.hl=null; D.drawer=null; render(); break;
    case 'anchor': {
      var c=+el.dataset.ch;
      D.screen='read'; D.readCh=c; D.drawer=null;
      D.hl={ ch:c, text:el.dataset.hl, label:el.dataset.label };
      render(); break;
    }
    case 'clear-hl': D.hl=null; render(); break;
    case 'open-thread': D.thread=el.dataset.thread; D.screen= D.empty?'map':'thread'; D.tMenu=false; render(); break;
    case 'new-thread': {
      var id='t'+(THREADS.length+1);
      THREADS.push({ id:id, name:'新线程 · 未命名', note:'刚刚创建 · 还没有内容', ch:null });
      D.thread=id; D.screen='thread'; D.tMenu=false;
      render(); toast('已新建线程，可以从一句话开始'); break;
    }
    case 'thread-menu': D.tMenu=!D.tMenu; if(D.tMenu){
        $('#cmpPop').innerHTML='<div class="pop" style="bottom:calc(100% + 6px);top:auto;width:280px">'+
          '<div class="hint">切换线程 · 多条线程共享同一套故事事实</div>'+
          THREADS.map(function(t){ return '<button data-act="open-thread" data-thread="'+t.id+'">'+esc(t.name)+
            '<span class="muted" style="margin-left:auto;font-size:12px">'+esc(t.note)+'</span></button>'; }).join('')+
          '<button data-act="new-thread">＋ 新建线程</button></div>';
      } else $('#cmpPop').innerHTML='';
      break;
    case 'adv-tab': D.adv=true; D.advTab=el.dataset.tab; D.screen='advanced'; render(); break;
    case 'mount': { var nm=el.dataset.name; D.mount=D.mount||{}; D.mount[nm]=D.mount[nm]===false?true:false;
      render(); toast(D.mount[nm]?'已挂载 '+nm:'已卸载 '+nm); break; }
    case 'drawer': D.drawer=el.dataset.id; renderOverlay(); break;
    case 'close-drawer': D.drawer=null; renderOverlay(); break;
    case 'unpin': delete D.pins[el.dataset.id]; render(); toast('已取消钉位'); break;
    case 'clear-sel': D.sel=null; render(); break;
    case 'focus-node': {
      var id2=el.dataset.id;
      if(!D.pins[id2]){
        var L=layout(), p=L.pos[id2];
        if(el.dataset.pin==='1'&&p) D.pins[id2]={x:p.x,y:p.y};
      }
      D.sel=id2; D.drawer=null; D.adv=false; D.screen='map';
      if(D.q!=='') D.qOpen=false;
      render(); break;
    }
    case 'cluster': D.clusterBy=el.dataset.cluster; render(); break;
    case 'vol2': D.vol2only=!D.vol2only; render(); break;
    case 'fv-filter': D.chFilter=el.dataset.k; render(); break;
    case 'zoom': {
      var z=el.dataset.z;
      if(z==='0'){ D.zoom=1; D.pan={x:0,y:0}; }
      else D.zoom=Math.min(2,Math.max(.6, D.zoom + (z==='1'?.15:-.15)));
      render(); break;
    }
    case 'unpin-all': D.pins={}; render(); toast('已解除全部钉位'); break;
    case 'expand': { var cl=el.dataset.cluster; if(D.expanded[cl]) delete D.expanded[cl]; else D.expanded[cl]=1;
      render(); break; }
    case 'decide': D.decisions[el.dataset.id]=el.dataset.dec; render(); break;
    case 'accept': case 'accept-preview': D.modal={kind:'impact'}; renderOverlay(); break;
    case 'split-accept': if(D.propState==='pending'){ D.modal={kind:'split'}; renderOverlay(); } break;
    case 'confirm-accept': {
      var btn=el, sp=el.dataset.split==='1';
      btn.className='btn primary loading';
      btn.innerHTML='<span class="spinner"></span>正在计算影响…';
      var fb=$('#overlay .modal .btn.primary'); if(fb){ fb.className='btn primary loading'; fb.innerHTML='<span class="spinner"></span>正在计算影响…'; }
      setTimeout(function(){ applyAccept(sp); },900);
      break;
    }
    case 'discard': D.modal={kind:'discard'}; renderOverlay(); break;
    case 'confirm-discard': D.modal=null; D.propState='discarded'; D.screen='map'; render(); toast('提案已丢弃，第 6 章回到计划中'); break;
    case 'close-modal': case 'modal-bg': if(act==='modal-bg'&&e.target!==el.parentElement) break;
      D.modal=null; renderOverlay(); break;
    case 'compare': D.modal={kind:'compare', ver:el.dataset.ver}; renderOverlay(); break;
    case 'rollback': D.modal={kind:'rollback', ver:el.dataset.ver}; renderOverlay(); break;
    case 'confirm-rollback': {
      var r=revN(el.dataset.ver);
      D.revision=r; D.modal=null;
      if(r<6 && (D.propState==='split'||D.propState==='accepted')) D.propState='pending';
      render(); toast('已回滚到 R'+r+'，地图与右栏同步回退'); break;
    }
    case 'go-version': D.modal=null; D.screen='read'; D.readCh=Math.max(1,revN(el.dataset.ver)); D.hl=null; render(); break;
    case 'retry-plugin': {
      var b=$('#btnRetryPlugin'); if(b){ b.className='btn primary loading'; b.innerHTML='<span class="spinner"></span>正在检测…'; }
      setTimeout(function(){ D.pluginErr=false; render(); toast('规划插件已就位，本章合同恢复可用'); },1100); break;
    }
    case 'retry-ai': D.aiFail=false; D.loading=true; render();
      setTimeout(function(){ D.loading=false; render(); toast('已重新生成：第 6 章草稿 · 6 条设定变更 · 3 个审阅问题'); },1500); break;
    case 'write-next': {
      if(D.loading) break;
      D.loading=true; render();
      setTimeout(function(){ D.loading=false; render(); toast('第 7 章草稿已生成：6 条设定变更 · 2 个审阅问题'); },1600); break;
    }
    case 'review-chapter': {
      var dd2=derive();
      if(dd2.propState==='pending'||dd2.propState==='expired') D.screen='proposal';
      else { D.screen='read'; D.readCh=6; }
      render(); break;
    }
    case 'rewrite-chapter': D.screen='proposal'; D.propState='pending'; D.revision=5; resetDecisions(); render();
      toast('已按未采纳建议重新起草第 6 章'); break;
    case 'read-draft': toast('全文约 2,800 字 · 原型保留前六段与结尾的悬念'); break;
    case 'push-debt': {
      var x=DEBTS.filter(function(v){ return v.id===el.dataset.id; })[0];
      setDraft('推进这条未收束债务：'+x.title+'。先给我两个可行的收束方式，不要直接改正文。');
      toast('已把指令草稿放进输入框，发不发由你决定'); break;
    }
    case 'write-for-char': {
      var c2=charOf(el.dataset.id);
      D.drawer=null;
      setDraft('从这个人物继续写：'+c2.name+'（'+c2.role+'）。保持现有关系状态，别让他知道还没轮到他知道的事。');
      renderOverlay(); toast('已把指令草稿放进输入框'); break;
    }
    case 'bootstrap': D.loading=true; render();
      setTimeout(function(){ D.empty=false; D.loading=false; render(); toast('立项提案已生成：18 人物 · 4 势力 · 5 地点 · 开篇三章'); },1500); break;
    case 'sim-connect': D.modal={kind:'connect'}; renderOverlay(); break;
    case 'sim-retry': D.modal=null; renderOverlay(); toast('侧车仍未连接：请先在本地启动沙盒推演'); break;
    case 'insert': {
      var i2=$('#cmpInput'); i2.value=(i2.value.replace(/\/[^\s]*$/,'').replace(/@[^\s]*$/,''))+el.dataset.text+' ';
      $('#cmpPop').innerHTML=''; i2.focus(); break;
    }
    case 'toast': toast(el.dataset.msg||'原型演示'); break;
    default: break;
  }
});
/* 地图：拖拽钉位 / 平移 / 滚轮缩放 / 双击开档案 / 键盘 */
document.addEventListener('pointerdown', function(e){
  var vp=e.target.closest('#mapVp'); if(!vp) return;
  var node=e.target.closest('[data-act="node"]');
  var L=layout(), mode=node?'node':'pan', id=node?node.dataset.id:null;
  var start={ x:e.clientX, y:e.clientY }, base= node ? (L.pos[id]||{x:0,y:0}) : { x:D.pan.x, y:D.pan.y };
  var moved=false;
  vp.classList.add('dragging');
  function mv(ev){
    var dx=ev.clientX-start.x, dy=ev.clientY-start.y;
    if(Math.abs(dx)+Math.abs(dy)>3) moved=true;
    var sc=MB.w/vp.clientWidth;
    if(mode==='node'){
      D.pins[id]={ x:base.x+dx*sc, y:base.y+dy*sc };
      var g=vp.querySelector('[data-act="node"][data-id="'+id+'"]');
      if(g) g.setAttribute('transform','translate('+(dx*sc)+','+(dy*sc)+')');
    } else {
      D.pan={ x:base.x+dx, y:base.y+dy };
      var g3=vp.querySelector('svg > g');
      if(g3) g3.setAttribute('transform','translate('+D.pan.x+','+D.pan.y+') scale('+D.zoom+')');
    }
  }
  function up(){
    document.removeEventListener('pointermove',mv); document.removeEventListener('pointerup',up);
    vp.classList.remove('dragging');
    if(mode==='node'&&moved){ D.sel=id; render(); toast('已钉住 '+charOf(id).name+' · 双击解除'); }
    else if(mode==='pan'&&moved){ render(); }
  }
  document.addEventListener('pointermove',mv); document.addEventListener('pointerup',up);
});
document.addEventListener('dblclick', function(e){
  var node=e.target.closest('[data-act="node"]');
  if(node){ D.drawer=node.dataset.id; renderOverlay(); }
});
document.addEventListener('wheel', function(e){
  var vp=e.target.closest('#mapVp'); if(!vp) return;
  e.preventDefault();
  D.zoom=Math.min(2,Math.max(.6, D.zoom + (e.deltaY<0?.08:-.08)));
  render();
},{ passive:false });
document.addEventListener('mouseover', function(e){
  var t=e.target.closest('[data-act="edge-tip"]'); if(!t) return;
  var r=RELS.filter(function(x){ return x.id===t.dataset.rel; })[0]; if(!r) return;
  var A=charOf(r.a), B=charOf(r.b), vp=$('#mapVp'), box=vp.getBoundingClientRect();
  var old=document.querySelector('.map-tip'); if(old) old.remove();
  var d=document.createElement('div'); d.className='map-tip';
  d.innerHTML='<b>'+esc(A.name)+' → '+esc(B.name)+'</b> '+esc(r.ab.text)+'<span class="d"><b>'+esc(B.name)+' → '+esc(A.name)+'</b> '+esc(r.ba.text)+'</span>'+
    (r.debt?'<span class="d">未了债务：'+esc(r.debt)+'</span>':'');
  d.style.left=Math.min(box.width-300, e.clientX-box.left+12)+'px';
  d.style.top=(e.clientY-box.top+12)+'px';
  vp.appendChild(d);
});
document.addEventListener('mouseout', function(e){
  if(e.target.closest('[data-act="edge-tip"]')){ var old=document.querySelector('.map-tip'); if(old) old.remove(); }
});
/* 键盘 */
document.addEventListener('keydown', function(e){
  var el=e.target.closest&&e.target.closest('[data-act="node"]');
  if(el && (e.key==='Enter'||e.key===' '||e.key==='d'||e.key==='D')){
    e.preventDefault();
    if(e.key==='Enter'||e.key===' '){ D.sel=el.dataset.id; render(); }
    else { D.drawer=el.dataset.id; renderOverlay(); }
    return;
  }
  var sw=e.target.closest&&e.target.closest('[role="switch"]');
  if(sw && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); sw.click(); return; }
  if(e.key==='Escape'){
    if(D.modal){ D.modal=null; renderOverlay(); }
    else if(D.drawer){ D.drawer=null; renderOverlay(); }
    else if(D.settings){ D.settings=false; renderOverlay(); }
    else if(D.tMenu){ D.tMenu=false; $('#cmpPop').innerHTML=''; }
    else if(D.qOpen){ D.qOpen=false; render(); }
    return;
  }
  if(e.key==='Enter'&&D.modal){
    var p=$('#overlay .modal .btn.primary'); if(p){ e.preventDefault(); p.click(); }
    return;
  }
  if(e.key==='Tab'&&D.modal){
    var f=$('#overlay .modal').querySelectorAll('button:not([disabled]), input:not([disabled]), textarea:not([disabled])');
    if(!f.length) return;
    var first=f[0], last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey&&document.activeElement===last){ e.preventDefault(); first.focus(); }
  }
});
/* 输入区 */
document.addEventListener('input', function(e){
  if(e.target.id==='cmpInput'){ renderCmpPop(); }
  if(e.target.id==='mapSearch'){ D.q=e.target.value; D.qOpen=true; render(); var i=$('#mapSearch'); if(i){ i.focus(); i.setSelectionRange(D.q.length,D.q.length); } }
  if(e.target.dataset&&e.target.dataset.act==='reason'){
    D.reasons[e.target.dataset.id]=e.target.value;
  }
});
document.addEventListener('change', function(e){
  if(e.target.dataset&&e.target.dataset.act==='reason'){ D.reasons[e.target.dataset.id]=e.target.value; }
});
/* ══════════════ 启动 ══════════════ */
(function boot(){
  try{
    var s=JSON.parse(localStorage.getItem(LS)||'{}');
    if(s.screen) D.screen=s.screen;
    if(s.themePref) D.themePref=s.themePref;
    if(s.revision) D.revision=s.revision;
    if(s.propState) D.propState=s.propState;
    if(s.adv) D.adv=true;
    if(s.narrow) D.narrow=true;
    if(s.readSize) D.readSize=s.readSize;
    if(s.readW) D.readW=s.readW;
    if(s.thread) D.thread=s.thread;
  }catch(err){}
  if(D.revision>=6&&(D.propState==='pending'||D.propState==='expired')) D.propState='expired';
  resolveTheme();
  if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').addEventListener){
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){ if(D.themePref==='auto'){ resolveTheme(); render(); } });
  }
  render();
})();
</script>
